# Base de données H2 en mémoire
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate crée le schéma automatiquement à partir des entités
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Désactiver OIDC — pas de Keycloak pendant les tests
quarkus.oidc.enabled=false
quarkus.oidc.tls.verification=none

# Désactiver la vérification JWT
quarkus.http.auth.proactive=false

# Stripe — valeurs factices pour satisfaire l'injection de config
stripe.secret-key=sk_test_fake
stripe.webhook-secret=whsec_fake

# Keycloak admin
keycloak.admin.url=http://localhost:8180
keycloak.admin.master-realm=master
keycloak.admin.user-realm=smart_linguo
keycloak.admin.client-id=admin-cli
keycloak.admin.username=fake
keycloak.admin.password=fake

# OpenAI
openai.api.key=sk-fake
openai.api.url=https://api.openai.com