services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: smartlinguo-keycloak
    command: start-dev
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    volumes:
      - keycloak_preprod_data:/opt/keycloak/data

  api:
    build: .
    restart: unless-stopped
    container_name: smartlinguo-api
    ports:
      - "8080:8080"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/${DB_NAME}
      DB_NAME: ${DB_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      OIDC_SECRET: ${OIDC_SECRET}
      STRIPE_SK: ${STRIPE_SK}
      STRIPE_WHSEC: ${STRIPE_WHSEC}
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - keycloak

volumes:
  keycloak_preprod_data: